name: Build Ancient Flutter APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04  # Используем старую ОС для совместимости
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 8
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '8'  # Древнему проекту нужна старая Java

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '1.22.6'  # Фиксируем версию Flutter из 2020 года, чтобы код не ломался

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-sound-null-safety

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Original-Cupertino-APK
          path: build/app/outputs/flutter-apk/app-release.apk
